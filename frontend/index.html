<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Notes Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Personal Notes Manager</h1>

    <!-- Form to Add/Edit Note -->
    <div class="form-container">
        <h3 id="form-title">Add New Note</h3>
        <input type="hidden" id="note-id">

        <label>Title:</label>
        <input type="text" id="title" placeholder="Note title">

        <label>Category:</label>
        <input type="text" id="category" placeholder="e.g. College, Ideas, Personal">

        <label>Content:</label>
        <textarea id="content" rows="4" placeholder="Write note details here..."></textarea>

        <div style="margin-bottom: 12px;">
            <label>
                <input type="checkbox" id="important"> Mark as Important ⭐
            </label>
        </div>

        <button id="save-btn" onclick="saveNote()">Add Note</button>
        <button id="cancel-btn" style="display:none; background-color: #6c757d;" onclick="resetForm()">Cancel</button>
    </div>

    <!-- Active vs Archived Tabs -->
    <div class="nav-tabs">
        <button id="active-tab-btn" class="active" onclick="showTab(false)">Active Notes</button>
        <button id="archived-tab-btn" onclick="showTab(true)">Archived Notes</button>
    </div>

    <!-- Search & Filter Controls -->
    <div class="search-bar">
        <input type="text" id="search" placeholder="Search notes by title..." oninput="filterNotes()">
        <select id="category-filter" onchange="filterNotes()">
            <option value="">All Categories</option>
        </select>
    </div>

    <!-- Notes List -->
    <div id="notes-list">
        <!-- Notes rendered here by app.js -->
    </div>

    <script src="app.js"></script>
</body>
</html>
